<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<base href="../../web/app/">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ios6.css"><link rel="stylesheet" href="altstore.css">
<style>
 .row { position: relative; height: 44px; margin-bottom: 8px; }
 .row .nav-item { visibility: visible; }
 .row.navbar { position: relative; }
 .kit { display: flex; gap: 16px; padding: 8px; background: #6d84a2; }
 .kit img { width: 16px; height: 17px; filter: drop-shadow(0 -1px 0 rgba(0,0,0,.45)); }
 .kit img.stop { width: 17px; }
</style></head>
<body style="margin:0;background:#c5ccd4">
<script>
const rows = [
  ["Featured", "Delta", "Install", "add"],
  ["Featured", "Delta", "Modify", "queued"],
  ["AltStore Source", "Provenance Emulator Long Name", "Upgrade", "add"],
  ["AltStore Source", "Provenance Emulator Long Name", "Modify", "queued"],
  ["Back", "Mark toggle (other builds)", "Install", "mark"],
];
for (const [back, title, label, kind] of rows) {
  const bar = document.createElement("div"); bar.className = "row navbar";
  bar.style.height = "44px";
  const item = document.createElement("div"); item.className = "nav-item";
  item.innerHTML = `<div class="nav-left"><button class="bar-button back">${back}</button></div><h1 class="nav-title">${title}</h1><div class="nav-right"><button class="bar-button">${label}</button></div>`;
  const b = document.createElement("button");
  b.className = "bar-button bar-icon nav-icon-left " + (kind === "mark" ? "mark-toggle" : "queue-toggle" + (kind === "queued" ? " is-queued" : ""));
  item.querySelector(".nav-right .bar-button").classList.add("nav-after-icon");
  item.querySelector(".nav-right").append(b);
  item.classList.add("has-nav-icon");
  bar.append(item); document.body.append(bar);
}
// The 4S's own glyphs beside them, for comparison (ref/ is gitignored, so this only shows in the main checkout's link)
const kit = document.createElement("div"); kit.className = "kit";
kit.innerHTML = `<img src="../../ref/4s/artwork/Shared@2x/UIButtonBarPlus.png"><img class="stop" src="../../ref/4s/artwork/Shared@2x/UIButtonBarStop.png">`;
document.body.append(kit);
</script>
</body></html>
