# agent-runner (https://github.com/FIZL0/agent-runner): `tmux new -s cydian agent-runner run 3`
[plan]
dir = "plan"
journal = "journal"

[run]
test = "tools/check.sh"
slots = 5
mode = "d"
rules = "AGENTS.md"
notes = ".runner"
joinable = ["plan/TODO.md", "plan/DONE.md", "journal/*/*.md"]
untested = ["*.md", "docs/*", "journal/*", "LICENSE*"]
# The native build (tools/check.sh) needs these two; they come from the shell that starts the runner (~/.bashrc),
# so no machine paths live in the repo. Without them the gate skips the native build with a note.
pass_env = ["SWIFT_TOOLCHAIN", "IOS_SDK"]

[git]
push = "origin"
push_merge = true
