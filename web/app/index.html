<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Opaque black status bar: with a translucent one the nav bar sits under it, iOS 26 blurs it there and taps
       near the top can go to the status bar instead of the buttons. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Light: the top of the blue status bar; dark: "Status Bar (Black)". screens/settings.js repaints both when
       Appearance is fixed to Light or Dark. -->
  <meta name="theme-color" content="#4f698b" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#5f656f" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <!-- We draw our own dark theme: the Dark Reader extension must leave the page alone. -->
  <meta name="darkreader-lock">
  <title>Cydian</title>
  <!-- Home Screen app (F10): iOS only offers Web Push to a site added to the Home Screen. -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
  <!-- Launch images for the home-screen app, one per iPhone screen (tools/icons.sh); without them iOS scales an icon
       up for its launch screen, which looked stretched. -->
  <link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1179x2556.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1290x2796.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1170x2532.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1284x2778.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1125x2436.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/launch/launch-828x1792.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/launch/launch-750x1334.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1206x2622.png">
  <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/launch/launch-1320x2868.png">
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ios6.css">
  <link rel="stylesheet" href="sources.css">
  <link rel="stylesheet" href="packages.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="altstore.css">
  <link rel="stylesheet" href="manage.css">
  <link rel="stylesheet" href="extras.css">
  <link rel="stylesheet" href="queue.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <main id="screens"></main>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
</body>
</html>
