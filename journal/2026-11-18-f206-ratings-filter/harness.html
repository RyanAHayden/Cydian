<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width">
<!-- F206 render harness: serve the repo root (python3 -m http.server) and open
     /journal/2026-11-18-f206-ratings-filter/harness.html?reviews[&filter=4][&dark]  or  ?head[&loaded][&norating] -->
<link rel=stylesheet href="/web/app/style.css"><link rel=stylesheet href="/web/app/ios6.css"><link rel=stylesheet href="/web/app/packages.css"><link rel=stylesheet href="/web/app/altstore.css"><link rel=stylesheet href="/web/app/reviews.css">
<style>html,body{margin:0;height:auto!important;overflow:visible!important} .page{visibility:visible!important;position:static!important;transform:none!important} .page-body{position:static!important;overflow:visible!important;height:auto!important}</style></head>
<body><div class="page"><div class="page-body grouped" id=b></div></div>
<script type=module>
const q = new URLSearchParams(location.search);
if (q.has("dark")) document.documentElement.dataset.theme = "dark";
const sp = await import("/web/app/screens/storepage.js");
const { reviewsTab } = await import("/web/app/screens/reviews.js");
const { el } = await import("/web/app/nav/ui.js");
const body = document.getElementById("b");
const now = Date.UTC(2026, 10, 18);
const icon = el("span", "pkg-icon large");
icon.append(el("span", "pkg-letter", "D"));
const header = sp.storeHeader({ art: icon, name: "Delta", author: "Riley Testut", line: sp.headerLine({ version: "1.6.3", size: "38.2 MB", price: "Free" }) });
const depiction = { average: 4, count: 4, noun: "Reviews", reviews: [
  { title: "Feels like a new phone", author: "mobileuser", rating: 5, text: "Runs everything I throw at it." },
  { title: "Great, one bug", author: "jbfan", rating: 4, version: "1.6.2", date: "Nov 9", text: "Controller skins reset after an update." },
  { title: "Solid", author: "ann", rating: 4, text: "Does what it says." },
  { title: "Crashes on launch", author: "bo", rating: 1, text: "On iOS 15.8 it closes at once." }] };
const appStore = { average: 4.8, count: 28385, noun: "Ratings", reviews: [{ title: "Cool update", author: "Deltatusigma", rating: 4, version: "1.6.3", at: now - 864e5, text: "The new skins are great." }] };
const api = { list: async () => ({ enabled: false, count: 0, reviews: [] }) };
if (q.has("measure")) { // the card's height as a skeleton, then filled (no ratings, so the from line is one line both times)
  const p1 = el("div", "store-pane"), p2 = el("div", "store-pane");
  body.append(p1, p2);
  reviewsTab(p1, { id: "x", api: { list: () => new Promise(() => {}) }, now });
  await reviewsTab(p2, { id: "x", api, now });
  const h = (p) => p.querySelector(".store-ratings").getBoundingClientRect().height;
  document.title = `skeleton=${h(p1)} filled=${h(p2)}`;
  throw new Error("measured");
}
if (q.has("reviews")) {
  const tabs = sp.storeTabs({ reviews: async (p) => {
    const t = await reviewsTab(p, { id: "com.rileytestut.Delta", api, depiction, appStore, now });
    if (q.has("filter")) t.setFilter(Number(q.get("filter")));
    document.title = "ready";
  } });
  header.setRating({ average: 4.6, count: 28389 });
  body.append(header.head, ...tabs.nodes);
  tabs.select(1);
} else {
  const tabs = sp.storeTabs({});
  body.append(header.head, ...tabs.nodes);
  const tiles = sp.tileRow();
  tiles.set("works", sp.worksOnTile({ status: "works", range: "iOS 15.0 or later" }));
  tiles.set("size", sp.sizeTile("38.2 MB", "Free"));
  tiles.set("section", sp.sectionTile("Games", "App"));
  tabs.panes.details.append(tiles.row);
  const filler = el("div", "group");
  filler.append(el("h2", "group-header", "Description"));
  tabs.panes.details.append(filler);
  if (q.has("loaded")) {
    const r = q.has("norating") ? null : { average: 4.8, count: 1 };
    header.setRating(r);
    tiles.set("rating", sp.ratingTile(r));
  }
  document.title = "ready";
}
</script></body></html>
