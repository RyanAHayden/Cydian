# iFizBox's install server (src/index.js). Deploy your own: worker/README.md.
name = "cydian-sign"
main = "src/index.js"
# The website: web/app/ served as static assets (index.html for app routes like /add).
assets = { directory = "../web/app", binding = "ASSETS", not_found_handling = "single-page-application", run_worker_first = ["/sign/*", "/api/*", "/healthz", "/repo", "/repo/*", "/reviews/*"] }
compatibility_date = "2026-11-01"

[vars]
HOST_IDS = "*.ifizbox"   # bundle IDs /sign/host keeps: any ending in .ifizbox (each team's own iFizBox ID)
TTL = "600"              # seconds a hosted update (or a website-signed app) stays
MAX_UPLOAD_MB = "512"    # largest IPA the website signs in the browser (/api/fetch?kind=ipa, /sign/upload); "0": none

# Wrangler makes this storage on the first deploy (or: `npx wrangler kv namespace create HOSTED`, and its id here).
[[kv_namespaces]]
binding = "HOSTED"

# F98: /api/account's per-address limit across isolates (Cloudflare's Rate Limiting binding, free; src/account.js).
# Without these it counts in each isolate's memory. period is 10 or 60 seconds; namespace_id is any number,
# unique in your account. Keep limit at ACCOUNT_RATE / ACCOUNT_WRITES.
[[ratelimits]]
name = "ACCOUNT_RATE_LIMIT"
namespace_id = "9801"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ACCOUNT_WRITE_LIMIT"
namespace_id = "9802"
simple = { limit = 12, period = 60 }

# F182: user reviews (src/reviews.js) in D1, free on the Workers Free plan (5 GB, 100,000 rows written a day). Wrangler
# makes the database on the first deploy, like HOSTED (or: `npx wrangler d1 create ifizbox-reviews`, and its
# database_id here); the Worker makes its tables itself. Owner-only delete: `npx wrangler secret put REVIEWS_ADMIN`.
# Optional: REVIEWS_SALT (a secret) salts the stored token and address hashes.
[[d1_databases]]
binding = "REVIEWS"
database_name = "ifizbox-reviews"

# F182: review writes (posts, reports) per address across isolates; keep limit at REVIEW_WRITES.
[[ratelimits]]
name = "REVIEW_RATE_LIMIT"
namespace_id = "9803"
simple = { limit = 6, period = 60 }
