<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 58" width="29" height="29">
  <!-- F135: Home's Settings row icon, our own grey gear drawn in the manner of iOS 6's Settings icon (not Apple's art). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e5e8"/>
      <stop offset="1" stop-color="#8f959c"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8087"/>
      <stop offset="1" stop-color="#3d4248"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9da3aa"/>
      <stop offset="1" stop-color="#d5d8dc"/>
    </linearGradient>
  </defs>
  <rect width="58" height="58" rx="12" fill="url(#bg)"/>
  <!-- teeth: 12 dashes round a ring (circumference 2*pi*19 = 119.38, 12 periods of 9.95) -->
  <circle cx="29" cy="29" r="19" fill="none" stroke="url(#gear)" stroke-width="6" stroke-dasharray="5.8 4.15"/>
  <circle cx="29" cy="29" r="16.5" fill="url(#gear)"/>
  <circle cx="29" cy="29" r="11.5" fill="none" stroke="#5a6067" stroke-width="2"/>
  <circle cx="29" cy="29" r="7.5" fill="url(#hub)"/>
  <circle cx="29" cy="29" r="3" fill="#4a4f55"/>
</svg>
