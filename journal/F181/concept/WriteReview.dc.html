<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Write a Review sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#fff}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 375px; height: 667px; overflow: hidden; display: flex; flex-direction: column; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: repeating-linear-gradient(90deg, #cbd0da 0 2.5px, #ced3dc 2.5px 8px) #ced3dc;">

  <div style="position: relative; flex: none; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; background: linear-gradient(#eff2f7, #eff2f7) top / 100% 1px no-repeat, linear-gradient(#2d3642, #2d3642) bottom / 100% 1px no-repeat, linear-gradient(#bdcbdc, #597498); box-shadow: 0 2.5px 2.5px -1px rgba(0,0,0,.18);">
    <a href="TweakReviews.dc.html" style="position: relative; z-index: 1; display: inline-flex; align-items: center; height: 30px; padding: 0 10px; font-size: 12px; font-weight: bold; text-decoration: none; text-shadow: 0 -1px 0 rgba(0,0,0,.5); border: 1px solid #36465c; border-radius: 5px; background: linear-gradient(#90a4c0, #5c7598 50%, #4e6a90 51%, #5a7699); background-origin: border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,.3);">Cancel</a>
    <span style="position: absolute; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: bold; color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,.5);">Write a Review</span>
    <a href="TweakReviews.dc.html" style="position: relative; z-index: 1; display: inline-flex; align-items: center; height: 30px; padding: 0 12px; font-size: 12px; font-weight: bold; text-decoration: none; text-shadow: 0 -1px 0 rgba(0,0,0,.5); border: 1px solid #1c3f86; border-radius: 5px; background: linear-gradient(#7fa3ea, #3c6fd6 50%, #2a5fcc 51%, #376ad2); background-origin: border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,.35);">Send</a>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 18px; color: #4c566c; text-shadow: 0 1px 0 rgba(255,255,255,.75);">
    <span style="font-size: 30px; letter-spacing: 6px;"><span style="color: #e08a1e;">★★★★</span><span style="color: #a9b0bc;">★</span></span>
    <span style="font-size: 14px;">Tap a Star to Rate</span>
  </div>

  <div style="flex: none; margin: 16px 10px 0; overflow: hidden; background: #fff; border: 1px solid #b7b9bd; border-radius: 9.5px; font-size: 17px;">
    <label style="display: flex; align-items: center; height: 44px; padding: 0 10px;">
      <span style="flex: none; width: 70px; font-weight: bold;">Title</span>
      <input type="text" value="Feels like a new phone" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font: inherit; color: #4c566c;">
    </label>
    <label style="display: flex; align-items: center; height: 44px; padding: 0 10px; border-top: 1px solid #c9c9c9;">
      <span style="flex: none; width: 70px; font-weight: bold;">Name</span>
      <input type="text" placeholder="Nickname" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font: inherit; color: #4c566c;">
    </label>
    <label style="display: block; border-top: 1px solid #c9c9c9;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Review</span>
      <textarea placeholder="Review (optional)" style="display: block; width: 100%; height: 170px; box-sizing: border-box; padding: 10px; border: 0; outline: none; resize: none; background: none; font: 15px/20px 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #000;">The Bouncy preset is perfect. No battery hit I can see after a week.</textarea>
    </label>
  </div>

  <div style="flex: none; margin: 10px 19px 0; font-size: 14px; line-height: 18px; text-align: center; color: #4c566c; text-shadow: 0 1px 0 rgba(255,255,255,.75);">Reviewing version 2.1.3 on iOS 15.8. One review per package per device; you can change it later.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":667}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
