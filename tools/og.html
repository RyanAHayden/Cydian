<!doctype html>
<!-- The cydian.dev link-preview card (web/app/icons/og.png): the app itself (a live iframe) on the black iPhone 4S
     from the Teehan+Lax iOS 5 kit (ref/, not committed; screen at 128,530 of its 1520x2970 bitmap) with its screen
     glare, the icon and name on Cydian's pinstripes on the left. Render from the repo root:
     python3 -m http.server 8000 & chromium --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
       --virtual-time-budget=4000 --user-agent="Mozilla/5.0 (iPhone; CPU iPhone OS 26_1 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148" \
       --screenshot=og.png http://localhost:8000/tools/og.html && magick og.png -strip web/app/icons/og.png -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cydian card</title>
<link rel="stylesheet" href="../web/app/ios6.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center; font-family: "Helvetica Neue", Helvetica, sans-serif;
    /* Cydian's pinstripes at 2.5x their width, so they survive a chat app shrinking the card to a thumbnail */
    background: repeating-linear-gradient(90deg, #c4cad6 0 6px, var(--pin-light) 6px 20px) var(--pin-light);
  }
  .side { flex: 1; padding: 0 30px 0 86px; color: var(--head); text-shadow: var(--emboss); }
  .side img { width: 152px; height: 152px; display: block; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
  h1 { margin: 22px 0 6px; font-size: 92px; line-height: 1; letter-spacing: -1.5px; }
  p { margin: 0 0 26px; font-size: 29px; line-height: 36px; }
  .bar-button { display: inline-block; height: 44px; padding: 0 18px; font-size: 21px; line-height: 42px; border-radius: 8px; text-decoration: none; }
  /* The phone: the kit's bitmap at --s of its point size (380 x 742.5 pt), the page in its 320 x 480 pt screen. */
  .phone { --s: .78; position: relative; flex: none; width: calc(380px * var(--s)); height: calc(742.5px * var(--s)); margin: 30px 110px 0 0; }
  .phone > img { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 14px 22px rgba(0,0,0,.35)); }
  .screen { position: absolute; left: calc(32px * var(--s)); top: calc(132.5px * var(--s)); width: 320px; height: 480px; overflow: hidden; transform: scale(var(--s)); transform-origin: 0 0; background: #000; }
  .screen iframe { display: block; width: 320px; height: 460px; border: 0; }
  .glare { position: absolute; inset: 0; z-index: 1; display: block; pointer-events: none; background: linear-gradient(200deg, rgba(255,255,255,.3), rgba(255,255,255,.1)); clip-path: polygon(58.7% -1%, 101% -1%, 101% 77.2%); } /* the kit's "Screen Glare" */

  /* iOS 6 status bar, opaque black, as Cydian asks for */
  .status { display: flex; align-items: center; height: 20px; padding: 0 5px; background: #000; color: #fff; font-size: 12px; font-weight: bold; text-shadow: 0 -1px 0 rgba(0,0,0,.6); }
  .status .bars { display: flex; align-items: flex-end; gap: 1px; height: 10px; margin-right: 4px; }
  .status .bars i { width: 3px; background: #fff; }
  .status .mid { flex: 1; text-align: center; }
  .status .bat { width: 22px; height: 10px; border: 1px solid #fff; border-radius: 2px; padding: 1px; position: relative; }
  .status .bat::before { content: ""; display: block; height: 100%; background: #fff; }
  .status .bat::after { content: ""; position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; background: #fff; border-radius: 0 1px 1px 0; }
  .status .side-r { width: 70px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
  .status .side-l { width: 70px; display: flex; align-items: center; }
</style>
</head>
<body>
<div class="side">
  <img src="../web/app/icons/icon-glossy-228.png" alt="">
  <h1>Cydian</h1>
  <p>The iOS 6 package manager,<br>for modern iPhones.</p>
  <span class="bar-button">cydian.dev</span>
</div>
<div class="phone">
  <img src="../ref/teehanlax/ios5/img-hd/08.png" alt="">
  <div class="screen">
    <div class="status">
      <span class="side-l"><span class="bars"><i style="height:3px"></i><i style="height:5px"></i><i style="height:7px"></i><i style="height:9px"></i><i style="height:10px"></i></span>Carrier</span>
      <span class="mid">9:41 AM</span>
      <span class="side-r">100% <span class="bat"></span></span>
    </div>
    <iframe src="../web/app/index.html" scrolling="no"></iframe>
    <i class="glare"></i>
  </div>
</div>
</body>
</html>
