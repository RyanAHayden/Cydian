<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<!-- B57 probe: a .page-body-like box and a tab-bar-like button. ?m= picks how the button scrolls to the top:
  smooth  scrollTo({top:0, behavior:"smooth"}) alone
  toggle  the F148 code: overflow-y hidden for one layout, then scrollTo smooth
  tonly   the overflow toggle alone (does it move scrollTop?)
  raf     the B57 code: tabbar.js scrollToTop (copy tabbar.js beside this file)
  Every rAF for 900 ms after the tap, scrollTop is logged and POSTed to /log. -->
<style>
html,body{margin:0;height:100%;font:17px -apple-system,Helvetica Neue,sans-serif}
#hud{position:fixed;left:0;right:0;top:0;height:60px;background:#222;color:#0f0;font:12px monospace;white-space:pre}
#box{position:fixed;left:0;right:0;top:60px;bottom:100px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff}
#bar{position:fixed;left:0;right:0;bottom:0;height:100px;background:#333;color:#fff;font-size:30px;line-height:100px;text-align:center}
.row{height:88px;line-height:88px;border-bottom:1px solid #ccc;padding-left:16px;font-size:28px}
</style></head><body>
<div id="hud"></div><div id="box"></div><div id="bar">TOP</div>
<script type="module">
import { scrollToTop } from "./tabbar.js";
const M = new URLSearchParams(location.search).get("m") || "raf";
const box = document.getElementById("box"), hud = document.getElementById("hud");
for (let i = 0; i < 300; i++) { const d = document.createElement("div"); d.className = "row"; d.textContent = "row " + i; box.append(d); }
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
hud.textContent = M + " reduce=" + reduce;
box.scrollTop = 4000;
document.getElementById("bar").addEventListener("click", () => {
  const t0 = performance.now(), frames = [[0, box.scrollTop]];
  if (M === "smooth") box.scrollTo({ top: 0, behavior: "smooth" });
  else if (M === "toggle" || M === "tonly") {
    box.style.overflowY = "hidden"; void box.offsetHeight; box.style.overflowY = "";
    frames.push([+(performance.now() - t0).toFixed(1), box.scrollTop, "after toggle"]);
    if (M === "toggle") box.scrollTo({ top: 0, behavior: "smooth" });
  } else scrollToTop(box);
  frames.push([+(performance.now() - t0).toFixed(1), box.scrollTop, "after call"]);
  const f = (now) => { frames.push([+(now - t0).toFixed(1), box.scrollTop]); if (now - t0 < 900) requestAnimationFrame(f); else {
    hud.textContent = M + " reduce=" + reduce + " " + frames.length + " frames\n" + frames.slice(0, 8).map((x) => x[1]).join(" ");
    fetch("/log", { method: "POST", body: JSON.stringify({ m: M, reduce, smoothCSS: "scrollBehavior" in document.documentElement.style, ua: navigator.userAgent, frames }) }); } };
  requestAnimationFrame(f);
});
</script></body></html>
