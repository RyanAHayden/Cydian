<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Opaque black status bar: with a translucent one the nav bar sits under it, iOS 26 blurs it there and taps
       near the top can go to the status bar instead of the buttons. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <title>Cydian</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ios6.css">
  <link rel="stylesheet" href="sources.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <main id="screens"></main>
  <nav class="tabbar" id="tabbar" aria-label="Tabs"></nav>
</body>
</html>
